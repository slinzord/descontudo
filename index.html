<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<title>Descontudo Ofertas — retorno</title>
<style>
  :root { --bg:#fff7ed; --fg:#1c1917; --card:#ffffff; --accent:#ea580c; --muted:#57534e; }
  @media (prefers-color-scheme: dark) { :root { --bg:#1c1917; --fg:#fafaf9; --card:#292524; --accent:#fb923c; --muted:#a8a29e; } }
  body { margin:0; padding:24px 16px; background:var(--bg); color:var(--fg); font:16px/1.5 system-ui, sans-serif; }
  main { max-width:560px; margin:0 auto; background:var(--card); border-radius:12px; padding:24px; }
  h1 { margin:0 0 8px; font-size:22px; color:var(--accent); }
  p { color:var(--muted); }
  code { display:block; word-break:break-all; padding:12px; border-radius:8px; background:var(--bg); font-size:15px; }
  button { margin-top:12px; padding:10px 16px; border:0; border-radius:8px; background:var(--accent); color:#fff; font-weight:600; cursor:pointer; }
</style>
</head>
<body>
<main>
  <h1>🔥 Descontudo Ofertas</h1>
  <div id="out"><p>Página de retorno da autorização do Mercado Livre. Nada é enviado a outro servidor: o código fica só neste navegador.</p></div>
</main>
<script>
  (function () {
    var q = new URLSearchParams(location.search);
    var out = document.getElementById('out');
    function esc(s) { var d = document.createElement('div'); d.textContent = s; return d.innerHTML; }
    if (q.get('error')) {
      out.innerHTML = '<p>Autorização não concluída.</p><code>' + esc(q.get('error') + ' ' + (q.get('error_description') || '')) + '</code>';
      return;
    }
    var code = q.get('code');
    if (!code) return;
    out.innerHTML = '<p>Autorização recebida. Copie o código abaixo e cole no terminal do projeto. Ele vale por poucos minutos e só funciona uma vez.</p>' +
      '<code id="c">' + esc(code) + '</code>' +
      (q.get('state') ? '<p>state: ' + esc(q.get('state')) + '</p>' : '') +
      '<button id="b">Copiar código</button>';
    document.getElementById('b').onclick = function () {
      navigator.clipboard.writeText(code).then(function () { document.getElementById('b').textContent = 'Copiado'; });
    };
  })();
</script>
</body>
</html>
